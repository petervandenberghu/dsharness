project: huizen-demo
doel: Voorspel de verkoopprijs van een huis (in duizenden euro's).
target: prijs_k
taak: regressie
data: oefenset:huizen          # of een pad naar een csv, relatief aan dit bestand

# local_only: alle modellen moeten lokaal draaien (ollama, vllm).
# cloud_allowed: ook cloudmodellen. De agents krijgen samenvattingen te zien, geen ruwe rijen.
data_policy: cloud_allowed

# Per rol één model, of een lijst: bij aanhoudende fouten (overbelast, daglimiet) neemt het volgende het over.
# De gratis Gemini-laag heeft per model een eigen dagquotum; daarom heeft elke rol een andere eerste keus.
# Reviewer leeg laten = alleen de vaste regels. Valt de LLM-laag van de Reviewer weg, dan gelden alleen de regels.
modellen:
  data_scout: [google:gemini-3.1-flash-lite, google:gemini-flash-lite-latest, google:gemini-3.5-flash-lite, google:gemini-3.5-flash]
  reviewer: [google:gemini-3-flash-preview, google:gemini-flash-latest, google:gemini-3.5-flash, google:gemini-3.5-flash-lite]
  verkenner: [google:gemini-3.5-flash-lite, google:gemini-3.1-flash-lite, google:gemini-flash-lite-latest, google:gemini-3.5-flash]
  prep_engineer: [google:gemini-3.5-flash, google:gemini-3-flash-preview, google:gemini-flash-latest, google:gemini-3.1-flash-lite]
  modeler: [google:gemini-flash-latest, google:gemini-3.5-flash, google:gemini-3-flash-preview, google:gemini-flash-lite-latest]
