project: huizen-demo
doel: Voorspel de verkoopprijs van een huis (in duizenden euro's).
target: prijs_k
taak: regressie
data: oefenset:huizen          # of een pad naar een csv, relatief aan dit bestand

# local_only: alle modellen moeten lokaal draaien (ollama, vllm).
# cloud_allowed: ook cloudmodellen. De agents krijgen samenvattingen te zien, geen ruwe rijen.
data_policy: cloud_allowed

# Per rol één model, of een lijst: bij aanhoudende fouten (overbelast, daglimiet) neemt het volgende het over.
# Reviewer leeg laten = alleen de vaste regels.
# Lokaal: Ollama staat standaard op 4096 tokens context; dat is te krap. Maak een variant met meer context:
#   ollama create gemma4-16k -f Modelfile   (Modelfile: "FROM gemma4:12b" en "PARAMETER num_ctx 16384")
modellen:
  data_scout: [google:gemini-3.1-flash-lite, ollama:gemma4-16k]
  reviewer: [google:gemini-3-flash-preview, ollama:gemma4-16k]
  verkenner: [google:gemini-3.1-flash-lite, ollama:gemma4-16k]
