[project]
name = "dsharness"
version = "0.0.1"
description = "Multi-agent data science harness met een cockpit-notebook"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pydantic-ai-slim[google,openai]>=2.57.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "papermill>=2.7.0",
    "nbconvert>=7.17.2",
    "joblib>=1.6.0",
    "mlflow>=3.17.1",
    "fastapi>=0.153.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
]

[project.scripts]
dsharness = "dsharness.cli:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "jupyter_client>=8.6",
    "nbformat>=5.10",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsharness"]
