[project]
name = "dsharness"
version = "0.0.1"
description = "Multi-agent data science harness met een cockpit-notebook"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "jupyter_client>=8.6",
    "nbformat>=5.10",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsharness"]
